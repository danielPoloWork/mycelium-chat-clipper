    service:    false
    announce:   false                          # Q4.8 — ASSUMED default
    layered:    true                           # Q5.4a — seed the four workspace packages as the layered skeleton
    api_spec:   false                          # Q5.5 — ASSUMED: the IDL is JSON Schema GENERATED from Zod (roadmap 2.5), not a hand-written stub

i18n:
