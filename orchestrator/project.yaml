  lang_name:       "TypeScript 5 (strict)"
  lang_standard:   "TypeScript 5.x strict (noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, verbatimModuleSyntax), ES2022 ESM; Node >= 22 LTS for the core and tools packages; Chromium (Chrome/Edge) >= 120, Manifest V3"
  secondary_lang:  ""                          # Q1.2 — HTML/CSS (Preact UI, native CSS) and JSON Schema (the polyglot contract) are supporting layers, not a second profile
  group_path:      "it/mycelium-labs"          # Q1.3 — asked
