  linter:          "ESLint (typescript-eslint type-aware, eslint-plugin-boundaries for the layer matrix) + tsc --noEmit --strict + commitlint"
  sanitizers:      "tsc --strict (type soundness); eslint --max-warnings 0; no-network-check (static scan of the production bundle, content script included); size-limit (content script <= 300 kB); pnpm audit; CodeQL"
  coverage_tool:   "Vitest coverage (v8) — per-package thresholds: core >= 90% (canon, hash, slug, path, sanitizeUrl at 100%), adapters >= 80%"
  coverage_target: 80                          # Q3.2 — the repository floor; the per-package thresholds above are NFR-010
  doc_tool:        ""                          # Q3.5 — ASSUMED from the profile (TypeDoc); the spec mandates JSDoc on public API but names no generator
  version_file:    ""                          # profile (version.ts mirroring package.json)
  version_const_hint: ""                       # profile
  package_ecosystem: ""                        # profile (npm)
  commands:
    build:        "pnpm build"
    test:         "pnpm test:unit && pnpm test:contract"
    format_check: "pnpm prettier --check ."
    lint:         "pnpm eslint . --max-warnings 0 && pnpm tsc --noEmit"
    bench:        ""                           # Q3.6 — ASSUMED from the profile (pnpm vitest bench); the spec's 1,000-message perf fixture names no script

ci:                          # Profile defaults REFRESHED (confirmed by the owner 2026-09-11): Node 18 and 20 are end-of-life in 2026; Windows kept for CON-006 path rules; macOS dropped (no macOS-specific behavior)
  tier1_platforms: "Linux and Windows on Node 22 and 24 LTS; Chromium (Chrome/Edge) >= 120 for the extension"
  matrix:
    - { os: ubuntu-24.04, toolchain: "node-22", preset: test }
    - { os: ubuntu-24.04, toolchain: "node-24", preset: test }
    - { os: windows-2022, toolchain: "node-22", preset: test }
  setup_steps: |
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.toolchain == 'node-24' && '24' || '22' }}
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
  extra_jobs: |
    lint:
      name: lint / eslint + tsc + prettier
      runs-on: ubuntu-24.04
      needs: bootstrap
      if: needs.bootstrap.outputs.ready == 'true'
      steps:
        - uses: actions/checkout@v6
        - uses: pnpm/action-setup@v4
        - uses: actions/setup-node@v4
          with: { node-version: '22', cache: pnpm }
        - run: pnpm install --frozen-lockfile
        - run: pnpm prettier --check . && pnpm eslint . --max-warnings 0 && pnpm tsc --noEmit
  build_manifest: package.json

governance:
  posture: standard                            # Q0.5 — ASSUMED default (ADR-0015): single maintainer, internal, unregulated; spec §11 already mandates ADRs for security-relevant changes
  scopes: [core, adapters, extension, tools, contract, e2e, fixtures, build, tests, docs, ci, release]   # Q4.3 — derived from spec §14.1 packages + the standard four; provider sub-scopes (adapters/chatgpt) are a design-RFC decision
