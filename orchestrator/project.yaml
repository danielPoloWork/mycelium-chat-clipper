  project_slug:    "chatclipper"               # Q0.3 — confirmed by the owner over the spec's working code `lce`
  project_title:   "Mycelium Chat Clipper"     # Q0.1 — from the repository name; spec working name: "LLM Conversation Exporter"
  project_tagline: "Local-first MV3 browser extension that exports the open ChatGPT, Claude, or Gemini conversation as a self-contained, write-once JSON bundle"   # Q0.1 — spec §1.1
  project_series:  ""                          # no project family
  project_kind:    app                         # Q0.2 — a Chromium Manifest V3 extension is an end-user app (spec §1.1)

