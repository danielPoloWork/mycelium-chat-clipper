toolchain:                   # Q3.x — profile defaults overridden where spec §13/§14.4 deviates; blank = profile
  build_tool:      "WXT (Vite) for the extension; tsc --build for the core, adapters and tools packages"
  pkg_manager:     "pnpm (workspaces, locked)"
  test_framework:  "Vitest (unit, golden snapshots), fast-check (property-based), happy-dom (adapter DOM contract), Ajv (JSON Schema contract), Playwright (e2e against a synthetic provider) with axe-core (accessibility scan; approved by the PO on 2026-09-11 as an addition to spec §14.4)"
