  checkpoints:               # transition ledger — a human-gated move records confirmed_by + gate_results
    - { from: init, to: design, gates: ['manifest-valid'], at: 2026-09-11, confirmed_by: danielPoloWork, gate_results: { manifest-valid: OK } }
  refs: { rfcs: [], milestones: [], prs: [], releases: [] }

